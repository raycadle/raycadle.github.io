baseURL = 'https://raycadle.github.io/'
languageCode = 'en-us'
title = "Ray Cadle"
theme = "PaperMod"

disableKinds = ["RSS"]

[author]
  name = "Ray Cadle"
  email = "hiii@raycadle.com"

[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowCodeCopyButtons = false

[params.profileMode]
  enabled = true
  title = "✌️ Yo, I'm Ray!"
  subtitle = "Passionate Learner • Car Nerd • Fixer of Things"
  imageUrl = "images/avatar.png"
  imageWidth = 160
  imageHeight = 160
    
  [[params.profileMode.buttons]]
    name = "Notebook"
    url = "https://raycadle.github.io/notebook"
    
  [[params.profileMode.buttons]]
    name = "Github"
    url = "https://github.com/raycadle"

[params.assets]
  css = ["css/custom/custom.css"]
  favicons = "favicon.ico"
